- role: PhD Researcher
  org: MARVL Lab, SUTD
  location: Singapore
  dates: 01/2026 - Present
  advisor: Prof. Malika Meghjani
  projects:
    - title: 2026 Maritime RobotX Challenge, Computer Vision Lead
      dates: 02/2026 - 11/2026
      highlight: [home, resume]
      bullets:
        - "Built real-time YOLO detection and light-colour classification on Jetson Orin NX for a surface, underwater, and aerial vehicle team."
        - "Placed 4th of 22 teams from 10 countries in the Autonomy Challenge ([Final Standings](https://robotx.org/2026/11/14/2026-maritime-robotx-challenge-final-standings/))."
      details:
        - "Finals: 2026-11-08 to 2026-11-14, Promontory at Marina Bay, Singapore ([RobotX 2026](https://robotx.org/programs/2026/))."

    - title: "Co²Gen: Multi-Robot Collaboration with Vision-Language-Action Models"
      highlight: [home, resume]
      bullets:
        - "Managed the hardware for the bi-manual SO-101 arms, set up the storage and stacking tasks, collected collaborative demonstrations, and fine-tuned SmolVLA policies."
        - "Plan-generated data, combined with single-arm demonstrations, matched or beat two-arm teleoperated data, removing the need to teleoperate both arms at once [1]."
      details:
        - "Paper: [arXiv:2610.30671](https://arxiv.org/abs/2610.30671), under review."
        - "Setup: overhead ZED 2 stereo camera and one wrist camera per arm."
        - "Tasks: storage (open a cabinet, place a cube, close it) and stacking (stack two cubes in the shared area)."
        - "Data: 50 episodes per task with a human verifier for success, extra DAgger correction data, and single-arm and bi-manual teleoperated data for the baselines."
        - "Training: SmolVLA (`smolvla_base`), 20,000 steps, one policy per arm (decentralized)."
        - "Method: a VLM writes the collaborative plan as a Python function through a collaborative MCTS (actor and critic agents), checks sub-task preconditions with a VLM, and calls single-arm skills (YOLOv8 and blob detection, IK planner)."
        - "Result: matched two-arm teleoperated data on storage and beat it on stacking. Also evaluated zero-shot human-robot collaboration."

